# Крафты пропиткой для меню крафта
- type: constructionGraph
  id: ReagentCraft
  start: start
  graph:
  - node: start
    edges:
    - to: blueOintment
      completed:
      - !type:ConsumeReagentCraft
        reagent: Leporazine
        amount: 15
      steps:
      - material: Ointment
        amount: 1
        doAfter: 3
    - to: redOintment
      completed:
      - !type:ConsumeReagentCraft
        reagent: Pyrazine
        amount: 15
      steps:
      - material: Ointment
        amount: 1
        doAfter: 3
    - to: redPunctPack
      completed:
      - !type:ConsumeReagentCraft
        reagent: Puncturase
        amount: 15
      steps:
      - material: Brutepack
        amount: 1
        doAfter: 3
    - to: redLacePack
      completed:
      - !type:ConsumeReagentCraft
        reagent: Lacerinol
        amount: 15
      steps:
      - material: Brutepack
        amount: 1
        doAfter: 3
    - to: redBruizPack
      completed:
      - !type:ConsumeReagentCraft
        reagent: Bruizine
        amount: 15
      steps:
      - material: Brutepack
        amount: 1
        doAfter: 3
  - node: blueOintment
    entity: Blueointment1ReagentCraft
  - node: redOintment
    entity: RedOintment1ReagentCraft
  - node: redPunctPack
    entity: RedPunctPack1ReagentCraft
  - node: redLacePack
    entity: RedLacePack1ReagentCraft
  - node: redBruizPack
    entity: RedBruizPack1ReagentCraft
